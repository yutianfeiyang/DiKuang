<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检测报告结论</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#f2f4f7; color:#222; padding:16px;
  }
  .card {
    max-width:640px; margin:0 auto; background:#fff;
    border-radius:12px; overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,.08);
  }
  .header {
    background:linear-gradient(135deg,#1a5fb4,#3584e4);
    color:#fff; padding:22px 20px; text-align:center;
  }
  .header h1 { font-size:20px; letter-spacing:2px; }
  .header p { font-size:12px; opacity:.85; margin-top:6px; }
  .content { padding:8px 20px 20px; }
  .row {
    display:flex; padding:12px 0;
    border-bottom:1px solid #eef0f3; font-size:14px;
  }
  .row:last-child { border-bottom:none; }
  .label { width:110px; color:#666; flex-shrink:0; }
  .value { flex:1; color:#111; word-break:break-all; }
  .result {
    margin-top:16px; padding:18px;
    background:#eaf5ea; border-left:4px solid #2ec27e;
    border-radius:6px;
  }
  .result .title {
    font-size:13px; color:#2ec27e; font-weight:600; margin-bottom:8px;
  }
  .result .text { font-size:15px; line-height:1.7; color:#1a1a1a; }
  .result .text b { color:#c01c28; font-size:18px; }
  .sign { display:flex; gap:16px; margin-top:20px; }
  .sign div {
    flex:1; text-align:center; font-size:13px; color:#444;
    border-top:1px dashed #ccc; padding-top:10px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>检 测 报 告 结 论</h1>
      <p>报告编号：RRS-JZYC20262000324</p>
    </div>
    <div class="content">
      <div class="row"><div class="label">委托单位</div><div class="value">河南地矿集团中昊建设工程有限公司</div></div>
      <div class="row"><div class="label">工程名称</div><div class="value">城郊煤矿建筑物下膏体充填开采项目充填钻孔</div></div>
      <div class="row"><div class="label">报告编号</div><div class="value">RRS-JZYC20252000324</div></div>
      <div class="row"><div class="label">报告日期</div><div class="value">2025年08月30日</div></div>
      <div class="row"><div class="label">样品名称</div><div class="value">普通硅酸盐水泥水泥浆密度</div></div>

      <div class="result">
        <div class="title">检 测 结 论</div>
        <div class="text">
          所检普通硅酸盐水泥水泥浆密度为 <b>1.81 g/cm³</b>，达到设计要求。
        </div>
      </div>

      <div class="sign">
        <div>审核人员：刘凯</div>
        <div>批准人员：黄清奎</div>
      </div>
    </div>
  </div>
</body>
</html>
